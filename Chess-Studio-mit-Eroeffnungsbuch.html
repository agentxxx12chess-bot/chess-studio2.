
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Studio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 12px;
  background: #171a20;
  color: #f1f3f5;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { margin: 8px 0; font-size: 30px; }

.subtitle {
  color: #aeb6c2;
  margin-bottom: 20px;
}

#status {
  margin: 15px auto;
  padding: 12px;
  max-width: 520px;
  background: #292f39;
  border-radius: 10px;
  font-weight: bold;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(8, minmax(0, 1fr));
  width: min(92vw, 520px);
  aspect-ratio: 1;
  margin: 0 auto;
  border: 3px solid #343b46;
  overflow: hidden;
}

.square {
  border: none;
  border-radius: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}

.light { background: #e5d5b8; }
.dark { background: #77936e; }

.piece-svg {
  width: 88%;
  height: 88%;
  display: block;
  overflow: visible;
  pointer-events: none;
}

.selected { background: #e6c84c !important; }

.legal::after {
  content: "";
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: rgba(20, 25, 20, 0.35);
  position: absolute;
}

.last-move { background: #b8bd65; }

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px auto;
}

.control {
  padding: 12px 17px;
  border: none;
  border-radius: 9px;
  background: #343d4b;
  color: white;
  font-size: 15px;
}

.control:active { background: #52647d; }

#engine.active { background: #426b50; }

#moves {
  max-width: 520px;
  margin: 15px auto;
  padding: 12px;
  background: #222832;
  border-radius: 10px;
  text-align: left;
  min-height: 50px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

/* Eröffnungsbuch */
#opening-book{max-width:520px;margin:18px auto;text-align:left}
#opening-book[hidden],#opening-detail[hidden],#opening-list[hidden]{display:none}
.book-card{background:#222832;border:1px solid #394454;border-radius:12px;padding:14px;margin-bottom:12px}
.book-title{font-size:20px;font-weight:bold;margin-bottom:9px}
.book-description{color:#b9c4d3;font-size:13px;line-height:1.6;margin:8px 0 12px}
.book-opening{width:100%;display:block;text-align:left;padding:13px;margin:8px 0;border:1px solid #465264;border-radius:10px;background:#303a49;color:white;cursor:pointer}
.book-opening strong{display:block;font-size:15px;margin-bottom:5px}
.book-opening span{font-size:12px;color:#bdc8d6}
#opening-board{width:min(92vw,420px);margin:12px auto}
#opening-position-label{text-align:center;color:#b9c4d3;font-size:13px;margin:8px 0}
#opening-moves{line-height:2;overflow-wrap:anywhere;color:#d5deea}
.opening-move{display:inline-block;padding:2px 5px;margin:2px;border-radius:5px;background:#303a49}
.opening-move.current{background:#477b59;color:white}
.book-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.book-controls button{min-height:43px;border:1px solid #465264;border-radius:9px;background:#394556;color:white;font-weight:bold;cursor:pointer}
.book-controls button:disabled{opacity:.35}

</style>
</head>

<body>

<h1>♟ Chess Studio</h1>
<div class="subtitle">Dein Schachbrett</div>

<div id="status">Schachpartie wird geladen ...</div>

<div id="board" class="board"></div>

<div class="controls">
  <button class="control" id="undo">↶ Zurück</button>
  <button class="control" id="reset">Neue Partie</button>
  <button class="control" id="flip">Brett drehen</button>
  <button class="control" id="engine">🤖 Computer AUS</button>
</div>


<section id="opening-book" hidden>
 <div class="book-card" id="opening-list">
  <div class="book-title">Eröffnungsbuch</div>
  <div class="book-description">Wähle eine Eröffnung aus. Du kannst die Züge Schritt für Schritt ansehen.</div>
  <button class="book-opening" data-opening="italian"><strong>Italienische Partie</strong><span>1. e4 e5 2. Sf3 Sc6 3. Lc4</span></button>
  <button class="book-opening" data-opening="spanish"><strong>Spanische Partie</strong><span>1. e4 e5 2. Sf3 Sc6 3. Lb5</span></button>
  <button class="book-opening" data-opening="french"><strong>Französische Verteidigung</strong><span>1. e4 e6 2. d4 d5</span></button>
  <button class="book-opening" data-opening="sicilian"><strong>Sizilianische Verteidigung</strong><span>1. e4 c5 2. Sf3 d6</span></button>
  <button class="book-opening" data-opening="queens"><strong>Damengambit</strong><span>1. d4 d5 2. c4 e6</span></button>
 </div>
 <div class="book-card" id="opening-detail" hidden>
  <div class="book-title" id="opening-name"></div>
  <div class="book-description" id="opening-description"></div>
  <div id="opening-board" class="board"></div>
  <div id="opening-position-label"></div>
  <div id="opening-moves"></div>
  <div class="book-controls">
   <button id="opening-list-button">← Eröffnungen</button>
   <button id="opening-start">Anfang</button>
   <button id="opening-back">← Zurück</button>
   <button id="opening-next">Weiter →</button>
  </div>
 </div>
</section>

<div id="moves">Noch keine Züge</div>

<script type="module">
import { Chess } from
"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

const chess = new Chess();

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const movesElement = document.getElementById("moves");
const engineButton = document.getElementById("engine");

let selectedSquare = null;
let legalMoves = [];
let flipped = false;
let lastMove = null;

let engine = null;
let engineReady = false;
let engineThinking = false;
let vsComputer = false;

// Stockfish starten
try {
  engine = new Worker("./stockfish-19-lite-single.js");

  engine.onmessage = (event) => {
    const line = event.data;

    if (typeof line !== "string") return;

    if (line === "uciok") {
      engine.postMessage("isready");
      return;
    }

    if (line === "readyok") {
      engineReady = true;
      render();

      if (vsComputer && chess.turn() === "b") {
        startEngineMove();
      }
      return;
    }

    if (line.startsWith("bestmove")) {
      engineThinking = false;

      if (!vsComputer || chess.turn() !== "b") {
        render();
        return;
      }

      const moveText = line.split(" ")[1];

      if (!moveText || moveText === "(none)") {
        render();
        return;
      }

      try {
        const move = chess.move({
          from: moveText.substring(0, 2),
          to: moveText.substring(2, 4),
          promotion: moveText[4] || "q"
        });

        if (move) lastMove = move;
      } catch (error) {
        console.log("Engine-Zugfehler:", error);
      }

      render();
    }
  };

  engine.onerror = (error) => {
    console.error("Stockfish konnte nicht geladen werden:", error);
    statusElement.textContent =
      "Stockfish konnte nicht geladen werden. Bitte Dateinamen prüfen.";
  };

  engine.postMessage("uci");

} catch (error) {
  console.error(error);
  statusElement.textContent =
    "Stockfish konnte nicht gestartet werden.";
}

// Figuren
function pieceSvg(piece) {
  const white = piece.color === "w";
  const fill = white ? "#ffffff" : "#171717";
  const stroke = white ? "#292929" : "#000000";
  const type = piece.type;

  const shapes = {
    k: `
      <path d="M46 9 H54 V19 H64 V27 H54 V34 H69
      L74 83 H26 L31 34 H46 V27 H36 V19 H46 Z"/>
      <path d="M20 84 H80 V94 H20 Z"/>
      <path d="M35 48 H65" fill="none"/>
    `,
    q: `
      <path d="M24 38 L36 55 L50 32 L64 55 L76 38
      L69 79 H31 Z"/>
      <circle cx="24" cy="31" r="7"/>
      <circle cx="50" cy="24" r="7"/>
      <circle cx="76" cy="31" r="7"/>
      <path d="M20 80 H80 V94 H20 Z"/>
    `,
    r: `
      <path d="M24 20 H36 V31 H44 V20 H56 V31
      H64 V20 H76 V39 H70 L75 80 H25 L30 39 H24 Z"/>
      <path d="M20 81 H80 V94 H20 Z"/>
    `,
    b: `
      <path d="M50 12 C35 22 38 38 50 45
      C35 51 31 64 35 80 H65
      C69 64 65 51 50 45 C62 38 65 22 50 12 Z"/>
      <path d="M20 81 H80 V94 H20 Z"/>
      <path d="M43 28 L57 42" fill="none"/>
    `,
    n: `
      <path d="M24 81 C28 67 25 54 35 42
      C43 31 54 22 70 17 L77 30
      L66 39 L74 48 L68 61 L75 81 Z"/>
      <path d="M48 37 L55 31 L59 39 Z"
      fill="${stroke}" stroke="none"/>
      <circle cx="62" cy="28" r="2.8"
      fill="${white ? "#111" : "#fff"}" stroke="none"/>
      <path d="M20 81 H80 V94 H20 Z"/>
    `,
    p: `
      <circle cx="50" cy="25" r="14"/>
      <path d="M42 39 H58 L62 52
      C65 61 69 69 70 81 H30
      C31 69 35 61 38 52 Z"/>
      <path d="M20 81 H80 V94 H20 Z"/>
    `
  };

  return `
    <svg class="piece-svg"
         viewBox="0 0 100 100"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <g fill="${fill}"
         stroke="${stroke}"
         stroke-width="3"
         stroke-linejoin="round"
         stroke-linecap="round">
        ${shapes[type]}
      </g>
    </svg>
  `;
}

// Spielstatus
function gameStatus() {
  if (chess.isCheckmate()) {
    const winner = chess.turn() === "w" ? "Schwarz" : "Weiß";
    return "SCHACHMATT! " + winner + " gewinnt!";
  }

  if (chess.isStalemate()) return "PATT! Remis.";
  if (chess.isThreefoldRepetition()) return "REMIS durch Stellungswiederholung.";
  if (chess.isInsufficientMaterial()) return "REMIS – nicht genügend Material.";
  if (chess.isDraw()) return "REMIS!";

  if (engineThinking && vsComputer) return "Stockfish denkt ...";

  const player = chess.turn() === "w" ? "Weiß" : "Schwarz";

  if (chess.isCheck()) return player + " steht im SCHACH!";

  if (vsComputer && chess.turn() === "b") {
    return "Stockfish ist am Zug";
  }

  if (vsComputer) return "Du bist am Zug (Weiß)";

  return player + " ist am Zug";
}

// Brett zeichnen
function render() {
  boardElement.innerHTML = "";

  const position = chess.board();
  const rows = flipped ? [...position].reverse() : position;

  rows.forEach((row, rowIndex) => {
    const squares = flipped ? [...row].reverse() : row;

    squares.forEach((piece, colIndex) => {
      const realRow = flipped ? 7 - rowIndex : rowIndex;
      const realCol = flipped ? 7 - colIndex : colIndex;

      const file = "abcdefgh"[realCol];
      const rank = 8 - realRow;
      const squareName = file + rank;

      const square = document.createElement("button");
      square.className = "square";
      square.type = "button";

      const isLight = (realRow + realCol) % 2 === 0;
      square.classList.add(isLight ? "light" : "dark");

      if (selectedSquare === squareName) {
        square.classList.add("selected");
      }

      if (legalMoves.includes(squareName)) {
        square.classList.add("legal");
      }

      if (lastMove &&
          (lastMove.from === squareName || lastMove.to === squareName)) {
        square.classList.add("last-move");
      }

      if (piece) square.innerHTML = pieceSvg(piece);

      square.addEventListener("click", () => {
        clickSquare(squareName);
      });

      boardElement.appendChild(square);
    });
  });

  statusElement.textContent = gameStatus();

  const history = chess.history();

  if (history.length === 0) {
    movesElement.textContent = "Noch keine Züge";
  } else {
    let text = "";

    for (let i = 0; i < history.length; i += 2) {
      const number = Math.floor(i / 2) + 1;
      text += number + ". " + history[i];

      if (history[i + 1]) text += " " + history[i + 1];

      text += "   ";
    }

    movesElement.textContent = text;
  }
}

// Engine-Zug starten
function startEngineMove() {
  if (!engine || !engineReady) {
    statusElement.textContent = "Stockfish wird noch geladen ...";
    return;
  }

  if (!vsComputer || engineThinking) return;
  if (chess.turn() !== "b" || chess.isGameOver()) return;

  engineThinking = true;
  selectedSquare = null;
  legalMoves = [];

  render();

  engine.postMessage("position fen " + chess.fen());
  engine.postMessage("go movetime 800");
}

// Feld anklicken
function clickSquare(squareName) {
  if (chess.isGameOver()) return;
  if (engineThinking) return;

  if (vsComputer && chess.turn() === "b") return;

  const piece = chess.get(squareName);

  if (selectedSquare) {
    if (legalMoves.includes(squareName)) {
      makeMove(selectedSquare, squareName);
      return;
    }

    if (piece && piece.color === chess.turn()) {
      selectSquare(squareName);
      return;
    }

    selectedSquare = null;
    legalMoves = [];
    render();
    return;
  }

  if (piece && piece.color === chess.turn()) {
    selectSquare(squareName);
  }
}

// Feld auswählen
function selectSquare(squareName) {
  selectedSquare = squareName;

  legalMoves = chess
    .moves({ square: squareName, verbose: true })
    .map(move => move.to);

  render();
}

// Zug ausführen
function makeMove(from, to) {
  try {
    const move = chess.move({
      from: from,
      to: to,
      promotion: "q"
    });

    if (move) lastMove = move;
  } catch (error) {
    console.log(error);
  }

  selectedSquare = null;
  legalMoves = [];

  render();

  if (vsComputer && chess.turn() === "b" && !chess.isGameOver()) {
    startEngineMove();
  }
}

// Zurück
document.getElementById("undo").addEventListener("click", () => {
  if (engineThinking && engine) {
    engine.postMessage("stop");
    engineThinking = false;
  }

  if (chess.history().length > 0) {
    chess.undo();

    if (vsComputer && chess.history().length > 0) {
      chess.undo();
    }
  }

  const history = chess.history({ verbose: true });
  lastMove = history.length ? history[history.length - 1] : null;

  selectedSquare = null;
  legalMoves = [];
  render();
});

// Neue Partie
document.getElementById("reset").addEventListener("click", () => {
  if (engineThinking && engine) engine.postMessage("stop");

  chess.reset();
  engineThinking = false;
  selectedSquare = null;
  legalMoves = [];
  lastMove = null;

  render();
});

// Brett drehen
document.getElementById("flip").addEventListener("click", () => {
  flipped = !flipped;
  render();
});

// Computer ein- und ausschalten
engineButton.addEventListener("click", () => {
  vsComputer = !vsComputer;

  engineButton.textContent =
    vsComputer ? "🤖 Computer AN" : "🤖 Computer AUS";

  engineButton.classList.toggle("active", vsComputer);

  if (!vsComputer && engineThinking && engine) {
    engine.postMessage("stop");
    engineThinking = false;
  }

  render();

  if (vsComputer && chess.turn() === "b") {
    startEngineMove();
  }
});


/* Eröffnungsbuch: eigenes Brett und eigener Spielzustand */
const openingData={
 italian:{name:"Italienische Partie",description:"Eine klassische Eröffnung. Weiß entwickelt den Läufer nach c4 und richtet den Blick auf f7. Beide Seiten entwickeln ihre Figuren und kämpfen um das Zentrum.",moves:["e4","e5","Nf3","Nc6","Bc4","Bc5","c3","Nf6"]},
 spanish:{name:"Spanische Partie",description:"Weiß greift mit dem Läufer auf b5 den Springer auf c6 an, der den schwarzen e5-Bauern unterstützt.",moves:["e4","e5","Nf3","Nc6","Bb5","a6","Ba4","Nf6"]},
 french:{name:"Französische Verteidigung",description:"Schwarz antwortet auf e4 mit e6 und bereitet d5 vor. So entsteht ein strategischer Kampf um das Zentrum.",moves:["e4","e6","d4","d5","Nc3","Nf6","e5","Nfd7"]},
 sicilian:{name:"Sizilianische Verteidigung",description:"Mit c5 greift Schwarz das Zentrum von der Seite an. Die Sizilianische Verteidigung führt häufig zu asymmetrischen Stellungen.",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6"]},
 queens:{name:"Damengambit",description:"Weiß bietet mit c4 einen Bauern an, um das Zentrum zu beeinflussen. Schwarz kann das Angebot annehmen oder mit e6 ablehnen.",moves:["d4","d5","c4","e6","Nc3","Nf6","Bg5","Be7"]}
};
const openingBook=$("opening-book"),openingList=$("opening-list"),openingDetail=$("opening-detail"),openingBoard=$("opening-board");
let currentOpening=null,openingIndex=0;
function openingPosition(){
 const game=new Chess();
 if(!currentOpening)return game;
 for(let i=0;i<openingIndex;i++)game.move(currentOpening.moves[i]);
 return game;
}
function renderOpeningBoard(){
 if(!currentOpening)return;
 const game=openingPosition(),rows=game.board();openingBoard.innerHTML="";
 rows.forEach((row,r)=>row.forEach((piece,c)=>{
  const sq="abcdefgh"[c]+(8-r),el=document.createElement("button");
  el.type="button";el.className="square "+((r+c)%2===0?"light":"dark");
  if(piece)el.innerHTML=pieceSvg(piece);
  el.setAttribute("aria-label",sq+(piece?" "+piece.color+piece.type:""));
  openingBoard.appendChild(el);
 }));
 $("opening-position-label").textContent="Nach "+openingIndex+" Halbzügen · "+Math.ceil(openingIndex/2)+" Züge"+(game.isCheck()?" · Schach":"");
 const list=$("opening-moves");list.innerHTML="";
 currentOpening.moves.forEach((san,i)=>{
  if(i%2===0){const n=document.createElement("strong");n.textContent=(Math.floor(i/2)+1)+". ";list.appendChild(n);}
  const span=document.createElement("span");span.className="opening-move"+(i===openingIndex-1?" current":"");span.textContent=san;list.appendChild(span);
 });
 $("opening-back").disabled=openingIndex===0;
 $("opening-next").disabled=openingIndex>=currentOpening.moves.length;
}
function selectOpening(key){
 currentOpening=openingData[key];if(!currentOpening)return;
 openingIndex=0;$("opening-name").textContent=currentOpening.name;
 $("opening-description").textContent=currentOpening.description;
 openingList.hidden=true;openingDetail.hidden=false;renderOpeningBoard();
}
$("opening-book-button").onclick=()=>{openingBook.hidden=false;openingList.hidden=false;openingDetail.hidden=true;openingBook.scrollIntoView({behavior:"smooth",block:"start"});};
openingBook.querySelectorAll("[data-opening]").forEach(button=>button.addEventListener("click",()=>selectOpening(button.dataset.opening)));
$("opening-list-button").onclick=()=>{openingDetail.hidden=true;openingList.hidden=false;};
$("opening-start").onclick=()=>{openingIndex=0;renderOpeningBoard();};
$("opening-back").onclick=()=>{if(openingIndex>0){openingIndex--;renderOpeningBoard();}};
$("opening-next").onclick=()=>{if(currentOpening&&openingIndex<currentOpening.moves.length){openingIndex++;renderOpeningBoard();}};

render();
</script>

</body>
</html>
